{% extends 'projetos_iniciais/base.html' %}
{% load bootstrap3 %}

{% block content %}
  <div class="row">
    <div class="col-md-6 col-md-offset-3">
      <div class="page-header">
        <h1>Criar conta</h1>
      </div>

      <form action="{% url 'register' %}" method="post">
        {% csrf_token %}
        {% bootstrap_form form %}
        <input type="hidden" name="next" value="{% url 'index' %}" />
        <button class="btn btn-primary" name="submit" type="submit">Cadastrar-se</button>
      </form>
    </div>
  </div>
{% endblock content %}
