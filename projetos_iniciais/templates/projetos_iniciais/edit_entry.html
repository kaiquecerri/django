{% extends "projetos_iniciais/base.html" %}
{% load bootstrap3 %}
{% block content %}
  <p><a href="{% url 'topic' topic.id %}">{{ topic }}</a></p>
  <div class="page-header">
    <h1>Editar entrada</h1>
  </div>

  <form action="{% url 'edit_entry' entry.id %}" method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    <button class="btn btn-primary" name="submit" type="submit">Salvar</button>
  </form>
{% endblock content %}
